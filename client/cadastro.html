<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>To-do-list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class ="container" id="formularios">
        <div = "row justify-content-md-center">
            <form id="formularioCadastro">
                <h2>Cadastro</h2>
                <div class ="mb-3">
                    <label for="nomeInput" class ="form-label">Nome</label>
                    <input type="text" class = "form-control" name="nomeInput" id="nomeInput" placeholder="Nome Completo">
                </div>
                <div class ="mb-3">
                    <label for="emailInput" class ="form-label">Email</label>
                    <input type="email" class = "form-control" name="emailInput" id="emailInput" placeholder="MeuEmail@email.com">
                </div>
                <div class ="mb-3">
                    <label for="senhaInput" class ="form-label">Senha</label>
                    <input type="password" class = "form-control" name="senhaInput" id="senhaInput" placeholder="MinhaSenha"> 
                </div>
                <button type="button" class="button" onclick="manipuladorUser.htmlCadastro()">Registrar-se</button>
            </form>
        </div>
    </div>    
</body>
<script src="script.js"></script>
</html>
