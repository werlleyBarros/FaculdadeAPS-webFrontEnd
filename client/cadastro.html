<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>To-do-list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="formularios">
        <form id="formularioCadastro">
            <h2>Cadastro</h2>
            <label for="nomeInput">Nome</label>
            <input type="text" name="nomeInput" id="nomeInput" placeholder="Nome Completo">
            <label for="emailInput">Email</label>
            <input type="email" name="emailInput" id="emailInput" placeholder="MeuEmail@email.com">
            <label for="senhaInput">Senha</label>
            <input type="password" name="senhaInput" id="senhaInput" placeholder="MinhaSenha">
            <button type="button" onclick="manipuladorUser.htmlCadastro()">Registrar-se</button>
        </form>
    </div>    
</body>
<script src="script.js"></script>
</html>
