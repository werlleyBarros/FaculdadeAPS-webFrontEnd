<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="css/tarefas.css">
    <title>To-do-list</title>
</head>
<body>
    <button onclick="domUser.mostrarFormulario()">criar tarefa</button> 
    <div id= "formularioTasks" class="formularioTasks" >
        <form id="formTasks" onsubmit="manipuladorUser.htmlCreateTask(event)">
            <label for="">Titulo</label>
            <input type="text" name="tituloTarefa" id="tituloTarefa" autocomplete="off">
            <label for="">Descrição</label>
            <input type="text" name="descricaoTarefa" id="descricaoTarefa" autocomplete="off">
            <label for="">prazo de entrega</label>
            <input type="date" name="dataTarefa" id="dataTarefa" autocomplete="off">
            <button type="submit">Enviar</button>
        </form>
    </div>
    <div class="tarefasContainer" id="tarefasContainer">
        
    </div>
</body>
<script src="script.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    manipuladorUser.htmlShowAllTasks().catch(err => console.error(err));
});
</script>
</html>
